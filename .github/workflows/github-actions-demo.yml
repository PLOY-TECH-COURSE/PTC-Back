name: Deploy Spring Boot Application

on:
  pull_request:
    branches:
      - master  # master 브랜치로 머지될 때만 실행
    types:
      - closed

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21  # ✅ Java 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'  # OpenJDK 기반의 Temurin 사용
          java-version: '21'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/app.jar  # ✅ 정확한 파일명 지정

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Debug SSH Key
        run: |
          ls -lah ~/.ssh
          head -5 ~/.ssh/id_rsa  # SSH 키 앞부분만 확인 (보안 유의)

      - name: Test SSH Connection
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa remote-cli@${{ secrets.SERVER_HOST }} "echo 'SSH Connected!'"

      - name: Deploy with Docker Compose
        run: |
          # 서버로 JAR 파일 전송
          scp build/libs/app.jar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_DIR }}/app.jar
          
          # 서버에서 Docker 컨테이너 배포
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_DIR }}
          
            echo "📌 기존 컨테이너 중지 및 삭제..."
            docker compose down  # 기존 컨테이너 종료
            echo "📌 캐시 삭제 및 빌드..."
            docker compose build --no-cache
            echo "📌 새로운 컨테이너 실행..."
            docker compose up -d  # ✅ --build 옵션만 사용하여 재빌드 진행
          
            echo "🚀 배포 완료!"
          EOF
