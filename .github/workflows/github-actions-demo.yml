name: Deploy Spring Boot Application

on:
  pull_request:
    branches:
      - master  # master 브랜치로 머지될 때만 실행
    types:
      - closed

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21  # ✅ Java 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'  # OpenJDK 기반의 Temurin 사용
          java-version: '21'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Create GCP Credentials File #
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.GCP_CREDENTIALS }}" > src/main/resources/cosmic-kayak-467113-g5-7d0d19a6a74e.json

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build with Gradle
        run: ./gradlew build -x test --parallel --no-daemon --build-cache --configure-on-demand


      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/app.jar  # ✅ 정확한 파일명 지정

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GCP Credentials File  # ✅ 이 줄 추가
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.GCP_CREDENTIALS }}" > src/main/resources/cosmic-kayak-467113-g5-7d0d19a6a74e.json

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Setup SSH Key
        run: |
          set -eux
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 --decode > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Debug SSH Key
        run: |
          ls -lah ~/.ssh
          head -5 ~/.ssh/id_rsa  # SSH 키 앞부분만 확인 (보안 유의)

      - name: Test SSH Connection
        run: |
          ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa remote-cli@${{ secrets.SERVER_HOST }} "echo 'SSH Connected!'"

      - name: Deploy with Docker Compose
        run: |
          if [ ! -f build/libs/app.jar ]; then
            echo "❌ app.jar not found!"
            exit 1
          fi
          
          # 서버로 JAR 파일 전송
          scp -P ${{ secrets.SERVER_PORT }} build/libs/app.jar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_DIR }}/app.jar
          
          # 서버에서 Docker 컨테이너 배포
          ssh -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            cd ${{ secrets.DEPLOY_DIR }} 
          
            echo "📌 기존 컨테이너 중지 및 삭제..."
            docker compose down  # 기존 컨테이너 종료
  
            echo "📌 기존 이미지 삭제..."
            docker rmi -f $(docker images -q ploytechcourse:plte) 2>/dev/null || echo "이미지 없음"
  
            echo "📌 새로운 이미지 빌드 및 컨테이너 실행..."
            docker compose up -d --build
  
            echo "🚀 배포 완료!"
          EOF
