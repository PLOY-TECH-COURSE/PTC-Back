name: Deploy Spring Boot Application

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 21  # ✅ Java 21로 변경
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'  # OpenJDK 기반의 Temurin 사용
          java-version: '21'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ploytechcourse-0.0.1-SNAPSHOT.jar
          path: build/libs/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Download Artifact
        uses: actions/download-artifact@v3
        with:
          name: ploytechcourse-0.0.1-SNAPSHOT.jar
          path: build/libs

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Docker Compose
        run: |
          # 서버로 JAR 파일 전송
          scp build/libs/*.jar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_DIR }}/ploytechcourse-0.0.1-SNAPSHOT.jar
          
          # 서버에서 Docker 컨테이너 배포
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_DIR }}
          
            echo "📌 기존 컨테이너 중지 및 삭제..."
            docker compose down  # 기존 컨테이너 종료
            docker compose build --no-cache
            echo "📌 새로운 컨테이너 빌드 및 실행..."
            docker compose up -d --build  # 새로운 컨테이너 실행
          
            echo "🚀 배포 완료!"
          EOF
