name: Deploy Spring Boot Application

on:
  pull_request:
    branches: [ "master" ]
    types: [ "closed" ]

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Create GCP Credentials File
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.GCP_CREDENTIALS_B64 }}" | base64 --decode > src/main/resources/cosmic-kayak-467113-g5-a41d4c7c5286.json

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build with Gradle (bootJar)
        run: ./gradlew bootJar -x test --parallel --no-daemon --build-cache --configure-on-demand

      - name: Normalize Jar Name -> build/libs/app.jar
        run: |
          set -euxo pipefail
          JAR="$(ls -1 build/libs/*.jar | head -n1)"
          echo "Found JAR: $JAR"
          cp "$JAR" build/libs/app.jar
          ls -l build/libs/app.jar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/app.jar

  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GCP Credentials File (if needed by deploy step)
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.GCP_CREDENTIALS_B64 }}" | base64 --decode > src/main/resources/cosmic-kayak-467113-g5-a41d4c7c5286.json

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Setup SSH Key (Base64 decode)
        run: |
          set -eux
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 --decode > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Debug SSH Key (safe head)
        run: |
          ls -lah ~/.ssh
          head -5 ~/.ssh/id_rsa || true

      - name: Test SSH Connection
        run: |
          ssh -p "${{ secrets.SERVER_PORT }}" -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "echo 'SSH Connected!'"

      - name: Deploy with Docker Compose
        env:
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_DIR:  ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euxo pipefail

          # 0) 아티팩트 존재 확인
          test -f build/libs/app.jar

          # 1) 서버로 JAR 전송
          scp -P "$SERVER_PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            build/libs/app.jar "$SERVER_USER@$SERVER_HOST:$DEPLOY_DIR/app.jar"

          # 2) 서버에서 컨테이너 교체
          ssh -p "$SERVER_PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" bash -lc "
            set -euxo pipefail
            cd '$DEPLOY_DIR'

            echo 'docker compose down'
            docker compose down || true

            echo 'remove old image (if any)'
            docker rmi -f \$(docker images -q ploytechcourse:plte) 2>/dev/null || echo 'no old image'

            echo 'docker compose up -d --build'
            docker compose up -d --build

            echo 'deploy done'
          "
